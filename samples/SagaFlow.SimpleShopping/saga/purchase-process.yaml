name: purchase-process
version: "1.0"
domain: order
steps:
  - name: payment
    command: AuthorizePayment
    timeoutLimit: 10s
    maxAttempts: 3
    compensation:
      command: RefundPayment
    transitions:
      - event: success
        nextStep: inventory
      - event: failure
        nextStep: compensation
      - event: timeout
        nextStep: compensation
  - name: inventory
    command: ReserveInventory
    timeoutLimit: 20s
    maxAttempts: 2
    compensation:
      command: ReleaseInventory
    transitions:
      - event: success
        when: "result.available == true"
        nextStep: shipment
      - event: success
        else: true
        nextStep: compensation
      - event: failure
        nextStep: compensation
      - event: timeout
        nextStep: compensation
  - name: shipment
    command: CreateShipment
    transitions:
      - event: success
        nextStep: completed
      - event: failure
        nextStep: compensation
bigPicture: []
