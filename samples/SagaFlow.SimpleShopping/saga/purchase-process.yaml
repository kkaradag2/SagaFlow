name: purchase-process
version: "1.0"
domain: order
trigger:
  event: OrderCreated
initialStep: payment
steps:
  - name: payment
    command: AuthorizePayment
    compensation:
      command: RefundPayment
    transitions:
      - event: success
        nextStep: inventory
      - event: failure
        nextStep: compensation
  - name: inventory
    command: ReserveInventory
    compensation:
      command: ReleaseInventory
    transitions:
      - event: success
        when: "result.available == true"
        nextStep: shipment
      - event: success
        else: true
        nextStep: compensation
      - event: failure
        nextStep: compensation
  - name: shipment
    command: CreateShipment
    transitions:
      - event: success
        nextStep: completed
      - event: failure
        nextStep: compensation
bigPicture: []
