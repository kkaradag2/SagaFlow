name: order-process
version: "1.0"
domain: order

steps:
  - name: payment
    command: AuthorizePayment
    timeoutLimit: 10s
    maxAttempts: 3
    compensation:
      command: RefundPayment
    transitions:
      - event: success
        nextStep: inventory
      - event: failure
        nextStep: compensation
      - event: timeout
        nextStep: compensation

  - name: inventory
    command: ReserveInventory
    timeoutLimit: 10s
    maxAttempts: 3
    compensation:
      command: ReleaseInventory
    transitions:
      - event: success
        nextStep: shipment
      - event: failure
        nextStep: compensation
      - event: timeout
        nextStep: compensation

  - name: shipment
    command: CreateShipment
    timeoutLimit: 10s
    maxAttempts: 3
    compensation:
      command: CancelShipment
    transitions:
      - event: success
        nextStep: notification
      - event: failure
        nextStep: compensation
      - event: timeout
        nextStep: compensation

  - name: notification
    command: SendOrderNotification
    timeoutLimit: 10s
    maxAttempts: 3
    transitions:
      - event: success
        nextStep: completed
      - event: failure
        nextStep: compensation
      - event: timeout
        nextStep: compensation
